<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Mimmoza — analyse foncière et immobilière par l'IA</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mimmoza analyse un bien ou une parcelle en quelques minutes : PLU, risques, marché, potentiel constructible et bilan promoteur, avec Mimmo, votre copilote IA. 3 analyses rapides offertes chaque mois."
    />

    <!-- Icônes (générées depuis public/icons/mimmoza-192.png) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- Partage (Open Graph / réseaux sociaux) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mimmoza" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Mimmoza — analyse foncière et immobilière par l'IA" />
    <meta
      property="og:description"
      content="PLU, risques, marché, potentiel constructible et bilan promoteur : de la parcelle au permis, avec Mimmo, votre copilote IA."
    />
    <meta property="og:url" content="https://mimmoza.vercel.app/" />
    <meta property="og:image" content="https://mimmoza.vercel.app/icons/mimmoza-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Mesure d'audience : AUCUNE à ce jour (pas de compte d'analytics).
         En ajouter une imposera un bandeau de consentement (cf. BandeauCookies). -->

    <!--
      Politique d'indexation — valeur par défaut VOLONTAIREMENT restrictive.

      Mimmoza réutilise les données DVF de la DGFiP, dont l'article R. 112 A-3
      du livre des procédures fiscales interdit l'indexation par les moteurs de
      recherche externes.

      Le défaut est donc « noindex », et c'est le composant RobotsPolicy
      (src/components/RobotsPolicy.tsx) qui l'ASSOUPLIT sur les rares pages
      publiques sans donnée DVF. Le sens de la bascule compte : si le
      JavaScript ne s'exécute pas, l'état qui subsiste est l'état sûr.
      L'inverse — indexable par défaut, restreint par le JS — laisserait fuiter
      les pages en cas d'échec de rendu.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- PWA : installation depuis le navigateur (Android, iOS). -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mimmoza" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icons/mimmoza-192.png" />
  </head>
