<style>
/* ============================================================
   MimmozIA Mobile — coquille d'application (aperçu autonome)
   Palette : encre cadastrale. Le bleu est celui des levés
   topographiques, l'ocre celui du bâti sur un plan cadastral.

   Ce fichier est servi par Vite en dev à /mobile-preview.html.
   Pour l'ouvrir depuis un téléphone du même réseau :
       npm run dev -- --host
   puis http://<ip-du-pc>:5173/mobile-preview.html
   ============================================================ */
:root {
  --ground:      #F4F6F9;
  --surface:     #FFFFFF;
  --surface-alt: #EDF0F5;
  --hairline:    #D8DEE7;
  --hairline-soft: #E7EBF1;
  --ink:         #131820;
  --ink-soft:    #4A5464;
  --ink-faint:   #7C8697;
  --accent:      #2B5FD9;
  --accent-ink:  #FFFFFF;
  --ochre:       #9A6B33;
  --ochre-wash:  #F6EFE4;
  --good:        #1F7A4D;
  --bad:         #B3261E;
  --bad-wash:    #FBEAE9;

  --shadow-lift: 0 1px 2px rgba(19, 24, 32, .06), 0 8px 24px -12px rgba(19, 24, 32, .18);
  --shadow-bar:  0 -1px 0 var(--hairline), 0 -12px 24px -18px rgba(19, 24, 32, .35);

  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 20px;

  --font-ui:      "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Instrument Serif", ui-serif, Georgia, "Times New Roman", serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground:      #0D1015;
    --surface:     #151A21;
    --surface-alt: #1D232C;
    --hairline:    #2A323D;
    --hairline-soft: #212832;
    --ink:         #E8ECF2;
    --ink-soft:    #A3AEBE;
    --ink-faint:   #6F7A8A;
    --accent:      #6D93F0;
    --accent-ink:  #0D1015;
    --ochre:       #C79A5E;
    --ochre-wash:  #2A2214;
    --good:        #4FBE87;
    --bad:         #E8756B;
    --bad-wash:    #2C1917;
    --shadow-lift: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -12px rgba(0, 0, 0, .7);
    --shadow-bar:  0 -1px 0 var(--hairline), 0 -12px 24px -18px rgba(0, 0, 0, .8);
  }
}

:root[data-theme="dark"] {
  --ground:      #0D1015;
  --surface:     #151A21;
  --surface-alt: #1D232C;
  --hairline:    #2A323D;
  --hairline-soft: #212832;
  --ink:         #E8ECF2;
  --ink-soft:    #A3AEBE;
  --ink-faint:   #6F7A8A;
  --accent:      #6D93F0;
  --accent-ink:  #0D1015;
  --ochre:       #C79A5E;
  --ochre-wash:  #2A2214;
  --good:        #4FBE87;
  --bad:         #E8756B;
  --bad-wash:    #2C1917;
  --shadow-lift: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px -12px rgba(0, 0, 0, .7);
  --shadow-bar:  0 -1px 0 var(--hairline), 0 -12px 24px -18px rgba(0, 0, 0, .8);
}

* { box-sizing: border-box; }
html { color-scheme: light dark; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; }
[hidden] { display: none !important; }

button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---- Ossature téléphone ---------------------------------- */
.phone {
  max-width: 460px;
  margin: 0 auto;
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  background: var(--ground);
  border-inline: 1px solid var(--hairline-soft);
}
@media (max-width: 480px) { .phone { border-inline: 0; } }

/* ---- En-tête --------------------------------------------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  padding-top: max(10px, env(safe-area-inset-top));
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--hairline);
}
.brand { display: flex; align-items: baseline; gap: 7px; margin-right: auto; min-width: 0; }
.brand-mark { font-family: var(--font-display); font-size: 22px; line-height: 1; letter-spacing: -.01em; }
.brand-tag {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-faint);
}
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 11.5px;
  padding: 4px 9px; border-radius: 999px;
  border: 1px solid var(--hairline);
  background: var(--surface-alt);
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.pill b { color: var(--ink); font-weight: 500; }
.icon-btn {
  display: grid; place-items: center;
  width: 34px; height: 34px; flex: none;
  border-radius: 999px; border: 1px solid var(--hairline);
  background: var(--surface); color: var(--ink-soft);
}
.icon-btn svg { width: 17px; height: 17px; }

/* ---- Fil de conversation --------------------------------- */
.thread {
  overflow-y: auto;
  overscroll-behavior-y: contain;
  padding: 20px 16px 8px;
  display: flex; flex-direction: column; gap: 22px;
}

.msg-user {
  align-self: flex-end;
  max-width: 84%;
  background: var(--accent);
  color: var(--accent-ink);
  padding: 10px 14px;
  border-radius: var(--r-lg) var(--r-lg) 5px var(--r-lg);
  box-shadow: var(--shadow-lift);
  overflow-wrap: anywhere;
}

/* Message assistant : bloc de document, pas une bulle.
   La réponse est un texte à lire, pas une réplique. */
.msg-bot { display: flex; flex-direction: column; gap: 9px; }
.eyebrow {
  font-family: var(--font-mono);
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-faint);
  display: flex; align-items: center; gap: 7px;
}
.eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--hairline-soft); }
.msg-bot .body { overflow-wrap: anywhere; }
.msg-bot .body p { margin: 0 0 .7em; }
.msg-bot .body p:last-child { margin-bottom: 0; }
.msg-bot .body ul { margin: 0 0 .7em; padding-left: 1.15em; }
.msg-bot .body li { margin-bottom: .25em; }
.msg-bot .body strong { font-weight: 600; }
.msg-bot .body code {
  font-family: var(--font-mono); font-size: .88em;
  background: var(--surface-alt); padding: 1px 5px; border-radius: 5px;
}
.msg-bot .body h3 { font-size: 15px; margin: 1em 0 .4em; font-weight: 600; }

.caret {
  display: inline-block; width: 7px; height: 1.05em;
  background: var(--accent); border-radius: 1px;
  vertical-align: -2px; margin-left: 2px;
  animation: blink 1.05s steps(2, start) infinite;
}
@keyframes blink { to { opacity: 0; } }

/* ---- Outils en cours ------------------------------------- */
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tool {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--font-mono); font-size: 11px;
  padding: 3px 9px 3px 7px; border-radius: 999px;
  border: 1px solid var(--hairline);
  background: var(--ochre-wash); color: var(--ochre);
  font-variant-numeric: tabular-nums;
}
.tool .dot {
  width: 6px; height: 6px; border-radius: 999px; background: currentColor;
  animation: pulse 1.1s ease-in-out infinite;
}
.tool[data-state="done"] { background: var(--surface-alt); color: var(--ink-soft); border-color: var(--hairline-soft); }
.tool[data-state="done"] .dot { background: var(--good); animation: none; }
.tool[data-state="failed"] { background: var(--bad-wash); color: var(--bad); }
.tool[data-state="failed"] .dot { background: currentColor; animation: none; }
@keyframes pulse { 50% { opacity: .3; } }

.thinking { display: flex; align-items: center; gap: 7px; color: var(--ink-faint); font-size: 14px; }
.thinking i {
  width: 6px; height: 6px; border-radius: 999px; background: currentColor;
  animation: bounce 1.15s ease-in-out infinite;
}
.thinking i:nth-child(2) { animation-delay: .15s; }
.thinking i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

.notice {
  border: 1px solid var(--hairline);
  background: var(--bad-wash); color: var(--bad);
  border-radius: var(--r-md); padding: 10px 13px; font-size: 14px;
}

/* ---- Écran vide ------------------------------------------ */
.empty { padding: 6px 2px 0; display: flex; flex-direction: column; gap: 18px; }
.empty h1 {
  font-family: var(--font-display); font-weight: 400;
  font-size: 30px; line-height: 1.15; letter-spacing: -.015em;
  margin: 0; text-wrap: balance;
}
.empty h1 em { font-style: italic; color: var(--accent); }
.empty .lede { margin: 0; color: var(--ink-soft); font-size: 15px; max-width: 34ch; }
.suggest { display: flex; flex-direction: column; gap: 7px; }
.suggest-label {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint);
}
.chip {
  text-align: left; width: 100%;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--r-md);
  padding: 11px 13px; font-size: 14.5px; line-height: 1.35;
  display: flex; align-items: flex-start; gap: 10px;
  transition: border-color .14s, transform .14s;
}
.chip:hover { border-color: var(--accent); }
.chip:active { transform: scale(.985); }
.chip .ref {
  font-family: var(--font-mono); font-size: 10px; color: var(--ink-faint);
  padding-top: 3px; flex: none; letter-spacing: .04em;
}

.demo-flag {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: .09em; text-transform: uppercase;
  color: var(--ochre); background: var(--ochre-wash);
  border: 1px dashed color-mix(in srgb, var(--ochre) 40%, transparent);
  border-radius: var(--r-sm); padding: 7px 11px;
}

/* ---- Composeur ------------------------------------------- */
.composer {
  position: sticky; bottom: 0; z-index: 20;
  background: var(--surface);
  box-shadow: var(--shadow-bar);
  padding: 10px 12px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  display: flex; align-items: flex-end; gap: 8px;
}
.composer textarea {
  flex: 1; resize: none;
  font: inherit; font-size: 16px; /* < 16px déclenche le zoom iOS */
  color: var(--ink);
  background: var(--ground);
  border: 1px solid var(--hairline);
  border-radius: var(--r-lg);
  padding: 10px 14px;
  max-height: 132px; min-height: 44px;
  line-height: 1.35;
}
.composer textarea::placeholder { color: var(--ink-faint); }
.composer textarea:focus { outline: none; border-color: var(--accent); }
.send {
  flex: none; width: 44px; height: 44px;
  display: grid; place-items: center;
  border: 0; border-radius: 999px;
  background: var(--accent); color: var(--accent-ink);
  transition: opacity .14s, transform .14s;
}
.send:disabled { opacity: .32; cursor: default; }
.send:not(:disabled):active { transform: scale(.93); }
.send svg { width: 19px; height: 19px; }

/* ---- Feuille de connexion -------------------------------- */
.sheet-bg {
  position: fixed; inset: 0; z-index: 40;
  background: rgba(10, 13, 18, .5);
  backdrop-filter: blur(3px);
  display: grid; align-items: end; justify-items: center;
}
.sheet {
  width: 100%; max-width: 460px;
  background: var(--surface);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  border-top: 1px solid var(--hairline);
  padding: 22px 20px;
  padding-bottom: max(22px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; gap: 14px;
  animation: rise .26s cubic-bezier(.2, .8, .3, 1);
}
@keyframes rise { from { transform: translateY(14px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  .caret, .tool .dot, .thinking i { animation: none; }
}
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 24px; margin: 0; letter-spacing: -.01em; }
.sheet .hint { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint);
}
.field input {
  font: inherit; font-size: 16px; color: var(--ink);
  background: var(--ground);
  border: 1px solid var(--hairline); border-radius: var(--r-md);
  padding: 11px 13px;
}
.field input:focus { outline: none; border-color: var(--accent); }
.btn-primary {
  border: 0; border-radius: var(--r-md);
  background: var(--accent); color: var(--accent-ink);
  padding: 13px; font-weight: 600; font-size: 15px;
}
.btn-primary:disabled { opacity: .5; }
.btn-ghost {
  border: 0; background: none; color: var(--ink-faint);
  font-size: 13.5px; padding: 4px; text-decoration: underline; text-underline-offset: 3px;
}
.sheet .err {
  font-size: 13.5px; color: var(--bad);
  background: var(--bad-wash); border-radius: var(--r-sm); padding: 9px 11px;
}
</style>
</head>

var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3dnJxbmdiYWZxZGFla2JkZm5tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI2Njg1NzgsImV4cCI6MjA3ODI0NDU3OH0.cpgjWVBnXXjD5uL4yOT1xxdf1W8bQrGA04TlggHvS9o";

};
function toolLabel(n) {

/* --- Rendu Markdown minimal ------------------------------- */
function esc(s) {
  return String(s).replace(/[&<>]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c];
  });
}
function inlineMd(s) {
  return s.replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function renderMd(src) {
  var out = [], list = null;
  function flush() {
    if (list) {
      out.push("<ul>" + list.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>");
      list = null;
    }
  }
  esc(src).split("\n").forEach(function (raw) {
    var line = raw.replace(/\s+$/, "");
    var li = line.match(/^\s*[-*•]\s+(.*)$/);
    if (li) { if (!list) list = []; list.push(inlineMd(li[1])); return; }
    flush();
    if (!line.trim()) return;
    var h = line.match(/^#{1,4}\s+(.*)$/);
    out.push(h ? "<h3>" + inlineMd(h[1]) + "</h3>" : "<p>" + inlineMd(line) + "</p>");
  });
  flush();
  return out.join("");
}

/* --- Fil --------------------------------------------------- */

}
function addUser(text) {

    '<div class="body" hidden></div>';
  thread.appendChild(wrap);
  scrollDown();
  return {
    tools: wrap.querySelector(".tools"),
    thinking: wrap.querySelector(".thinking"),
    body: wrap.querySelector(".body")
  };
}
function addNotice(text) {
  var el = document.createElement("div");
  el.className = "notice";
  el.textContent = text;
  thread.appendChild(el);
  scrollDown();
}

    thread.appendChild(flag);

}

/* Échange d'exemple : la coquille doit montrer à quoi elle
   ressemble en fonctionnement, pas un écran vide. */
function renderExample() {
  addUser("Constructible en R+2 sur la parcelle AB 0142 à Annecy ?");
  var m = addBot();
  m.thinking.remove();
  m.tools.hidden = false;
  m.tools.innerHTML =
    '<span class="tool" data-state="done"><i class="dot"></i>Fiche parcelle · 1,2 s</span>' +
    '<span class="tool" data-state="done"><i class="dot"></i>Règlement PLU · 3,8 s</span>';
  m.body.hidden = false;
  m.body.innerHTML = renderMd(
    "La parcelle **AB 0142** (1 240 m²) est en zone **UB** au PLU d'Annecy.\n\n" +
    "- Hauteur maximale : **12 m au faîtage**, soit R+2 + combles\n" +
    "- Emprise au sol : 50 %\n" +
    "- Recul minimal : 4 m des limites séparatives\n\n" +
    "Le R+2 est donc admis. Attention : la parcelle est en périmètre de monument historique — l'avis de l'ABF sera requis."
  );
}

/* --- Appel réseau ----------------------------------------- */
function streamChat(message, ui) {
  var body = {
    message: message,
    mode: "quick",
    context: { vertical: "generique", route: "/mobile" }
  };
  if (conversationId) body.conversation_id = conversationId;

  return fetch(SUPABASE_URL + "/functions/v1/copilot-chat", {
    method: "POST",
    headers: {
      Authorization: "Bearer " + session.access_token,
      apikey: ANON_KEY,
      "Content-Type": "application/json"
    },
    body: JSON.stringify(body)
  }).then(function (res) {
    if (!res.ok) {
      return res.json().catch(function () { return {}; }).then(function (e) {
        if (res.status === 401) { session = null; store.clear(); refreshChrome(); }
        throw new Error(e.message || "Erreur " + res.status);
      });
    }
    if (!res.body) throw new Error("Réponse sans flux");
    return consume(res.body.getReader(), ui);
  });
}

function consume(reader, ui) {
  var dec = new TextDecoder();
  var chips = {};
  var buf = "";
  var text = "";

  function paint() {
    ui.body.hidden = false;
    ui.body.innerHTML = renderMd(text) + '<span class="caret"></span>';
    scrollDown();
  }

  function pump() {
    return reader.read().then(function (chunk) {
      if (chunk.done) {
        if (ui.thinking) ui.thinking.remove();
        ui.body.hidden = false;
        ui.body.innerHTML = text.trim() ? renderMd(text) : "<p>Aucune réponse reçue.</p>";
        scrollDown();
        return;
      }
      buf += dec.decode(chunk.value, { stream: true });
      var lines = buf.split("\n");
      buf = lines.pop() || "";

      for (var i = 0; i < lines.length; i++) {
        var t = lines[i].trim();
        if (t.indexOf("data:") !== 0) continue;
        var payload = t.slice(5).trim();
        if (!payload || payload === "[DONE]") continue;

        var ev;
        try { ev = JSON.parse(payload); } catch (e) { continue; }

        if (ev.type === "conversation") {
          conversationId = ev.conversation_id;

        } else if (ev.type === "reservation") {
          if (typeof ev.remaining === "number") setCredits(ev.remaining);

        } else if (ev.type === "token") {
          ui.thinking.hidden = true;
          text += ev.delta || "";
          paint();

        } else if (ev.type === "tool_use_start") {
          ui.thinking.hidden = true;
          ui.tools.hidden = false;
          var chip = document.createElement("span");
          chip.className = "tool";
          chip.innerHTML = '<i class="dot"></i>';
          chip.appendChild(document.createTextNode(toolLabel(ev.call.name)));
          ui.tools.appendChild(chip);
          chips[ev.call.id] = chip;
          scrollDown();

        } else if (ev.type === "tool_use_end") {
          var c = chips[ev.call.id];
          if (c) {
            c.dataset.state = ev.call.status === "error" ? "failed" : "done";
            var secs = (ev.call.duration_ms / 1000).toFixed(1).replace(".", ",");
            c.appendChild(document.createTextNode(" · " + secs + " s"));
          }

        } else if (ev.type === "done") {
          if (typeof ev.final_credits === "number") bumpCredits(-ev.final_credits);

        } else if (ev.type === "error") {
          throw new Error(ev.error || "Erreur pendant la génération");
        }
      }
      return pump();
    });
  }
  return pump();
}

/* --- Envoi ------------------------------------------------ */
function send() {
  var message = input.value.trim();
  if (!message || busy) return;
  if (!session) { openSheet(); return; }

  if (thread.querySelector(".empty")) thread.replaceChildren();

  busy = true;
  input.value = "";
  input.style.height = "auto";
  syncSend();
  addUser(message);
  var ui = addBot();

  streamChat(message, ui).catch(function (e) {
    if (ui.thinking) ui.thinking.remove();
    if (!ui.body.textContent.trim()) ui.body.remove();
    addNotice(e.message || "Connexion interrompue.");
  }).then(function () {
    busy = false;
    syncSend();
  });
}

/* --- Jetons ----------------------------------------------- */
function setCredits(n) {
  credits = n;
  creditsPill.hidden = false;
  creditsN.textContent = n.toLocaleString("fr-FR");
}
function bumpCredits(delta) {
  if (credits !== null) setCredits(Math.max(0, credits + delta));
}

/* --- Composeur -------------------------------------------- */
function syncSend() { sendBtn.disabled = !input.value.trim() || busy; }

input.addEventListener("input", function () {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 132) + "px";
  syncSend();
});
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
composer.addEventListener("submit", function (e) { e.preventDefault(); send(); });

/* --- Connexion -------------------------------------------- */
function openSheet() {
  if (document.getElementById("sheet")) return;

  var bg = document.createElement("div");
  bg.className = "sheet-bg";
  bg.id = "sheet";
  bg.innerHTML =
    '<div class="sheet" role="dialog" aria-modal="true" aria-label="Connexion">' +
      "<h2>Connexion</h2>" +
      '<p class="hint">Le même compte que sur le site. Vos identifiants partent directement vers votre Supabase.</p>' +
      '<div class="err" hidden></div>' +
      '<div class="field"><label for="em">Adresse e-mail</label>' +
        '<input id="em" type="email" autocomplete="username" inputmode="email" placeholder="vous@exemple.fr"></div>' +
      '<div class="field"><label for="pw">Mot de passe</label>' +
        '<input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>' +
      '<button class="btn-primary" id="go">Se connecter</button>' +
      '<button class="btn-ghost" id="cancel">Continuer sans compte</button>' +
    "</div>";
  document.body.appendChild(bg);

  var err = bg.querySelector(".err");
  var go = bg.querySelector("#go");
  var em = bg.querySelector("#em");
  var pw = bg.querySelector("#pw");

  bg.querySelector("#cancel").onclick = function () { bg.remove(); };
  bg.onclick = function (e) { if (e.target === bg) bg.remove(); };
  pw.onkeydown = function (e) { if (e.key === "Enter") go.click(); };

  go.onclick = function () {
    err.hidden = true;
    go.disabled = true;
    go.textContent = "Connexion…";
    fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { apikey: ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: em.value.trim(), password: pw.value })
    })
      .then(function (res) { return res.json().then(function (d) { return { ok: res.ok, d: d }; }); })
      .then(function (r) {
        if (!r.ok || !r.d.access_token) {
          throw new Error(r.d.error_description || r.d.msg || "Identifiants refusés.");
        }
        session = { access_token: r.d.access_token, email: em.value.trim() };
        store.write(session);
        bg.remove();
        refreshChrome();
        renderEmpty();
      })
      .catch(function (e) {
        err.textContent = e.message || "Connexion impossible.";
        err.hidden = false;
        go.disabled = false;
        go.textContent = "Se connecter";
      });
  };

  setTimeout(function () { em.focus(); }, 60);
}

document.getElementById("account").onclick = function () {
  if (!session) { openSheet(); return; }
  if (confirm("Connecté en tant que " + session.email + ".\n\nSe déconnecter ?")) {
    session = null;
    conversationId = null;
    credits = null;
    store.clear();
    refreshChrome();
    renderEmpty();
  }
};

function refreshChrome() {
  creditsPill.hidden = !session || credits === null;
  input.placeholder = session
    ? "Une adresse, une parcelle, une question…"
    : "Connectez-vous pour poser une question";
}

refreshChrome();
renderEmpty();
</script>
